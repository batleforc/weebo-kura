# The local tenant: groups from dev/authentik/blueprints/kura.yaml.
apiVersion: kura.weebo.io/v1alpha1
kind: KuraTenant
metadata: { name: dev }
spec:
  claimMappings:
    claim: groups
    roles: { owner: [kura-dev-owners], admin: [], member: [kura-dev] }
  vaultNamespaces: [dev]
  quota: { storage: 1Gi, maxFileSize: 100Mi }
  # RFC 0004: tokens may carry write rules (tests/heavy/keys.sh turns it off and on).
  scopedTokens: { write: true }
---
apiVersion: kura.weebo.io/v1alpha1
kind: KuraVault
metadata: { name: notes, namespace: dev }
spec:
  tenantRef: { name: dev }
  bindings:
    - { role: editor, claimValue: kura-dev }
---
# For Obsidian by hand (task obsidian:deploy): notes and each user's own
# .obsidian (RFC 0001 §6.8, observation 12). Apart from `notes`, which the
# heavy suites write as alice, so nothing they push reaches a real Obsidian.
apiVersion: kura.weebo.io/v1alpha1
kind: KuraVault
metadata: { name: obsidian, namespace: dev }
spec:
  tenantRef: { name: dev }
  configSync: { categories: [plugins, snippets, themes, hotkeys] }
  bindings:
    - { role: editor, claimValue: kura-dev }
---
# Members only read this one: `kura sync` here exits 3 (§6.P observation 2).
apiVersion: kura.weebo.io/v1alpha1
kind: KuraVault
metadata: { name: shared, namespace: dev }
spec:
  tenantRef: { name: dev }
  bindings:
    - { role: viewer, claimValue: kura-dev }
---
# RFC 0005 §6.P: the tabletop tenant. alice (jdr-mj) owns it, bob
# (jdr-players) reads two folders of `campaign`; search is on for the
# reader's search page (tests/heavy/reader.sh writes Sessions/, Resumes/
# and MJ/ as alice).
apiVersion: kura.weebo.io/v1alpha1
kind: KuraTenant
metadata: { name: jdr }
spec:
  claimMappings:
    claim: groups
    roles: { owner: [jdr-mj], member: [jdr-players] }
  vaultNamespaces: [jdr]
  search: { enabled: true }
---
apiVersion: kura.weebo.io/v1alpha1
kind: KuraVault
metadata: { name: campaign, namespace: jdr }
spec:
  tenantRef: { name: jdr }
  bindings:
    - { role: viewer, claimValue: jdr-players, paths: [Sessions/, Resumes/] }
---
# Another tenant nobody of the dev users belongs to: its vault must answer
# exactly as a missing one (§6.P observation 4, tests/heavy/authz.sh).
apiVersion: kura.weebo.io/v1alpha1
kind: KuraTenant
metadata: { name: other }
spec:
  claimMappings: { claim: groups, roles: { member: [other-members] } }
  vaultNamespaces: [other]
---
apiVersion: kura.weebo.io/v1alpha1
kind: KuraVault
metadata: { name: elsewhere, namespace: other }
spec:
  tenantRef: { name: other }
