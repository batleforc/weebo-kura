# kura-server against the local stack (task dev:stack, then task dev:run).
oidc:
  # Authentik's global issuer mode: one issuer for both client types; the
  # keys come from an application's discovery document (plan D52).
  issuer: https://localhost:59443/
  discovery: https://localhost:59443/application/o/kura/
  audiences: [kura-cli, kura-plugin, kura-web]
  platformAdmin: { claim: groups, value: kura-platform-admins }
listen: { api: 127.0.0.1:58080, metrics: 127.0.0.1:59090 }
vault:
  address: http://127.0.0.1:58200
  kubernetesAuth: { mount: kubernetes, role: kura }   # unused: KURA_VAULT_TOKEN is set
  secrets: { database: mv/data/kura/database, bucket: mv/data/kura/bucket }
  transit: { mount: transit }
# The web console (RFC 0003), from `task ui:build`, at http://127.0.0.1:58080/app/
# (the kura-web client of dev/authentik/blueprints/kura.yaml).
ui:
  enabled: true
  dir: ui/dist
  oidc: { clientId: kura-web, discovery: "https://localhost:59443/application/o/kura-web/" }
