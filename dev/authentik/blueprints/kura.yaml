version: 1
metadata:
  name: kura-dev
  labels:
    blueprints.goauthentik.io/instantiate: "true"

# Local Authentik for kura (operator guide §6), applied by the worker from the
# /blueprints mount. Disposable: fixed passwords, loopback only.
# Identities match dev/config/tenants.yaml: alice owns tenant `dev` and is a
# platform admin, bob is a member, carol is in no group.

entries:
  # The local CA's localhost certificate (task dev:certs), served on 9443 so the
  # issuer is https, as server.yaml requires.
  - model: authentik_crypto.certificatekeypair
    id: cert-localhost
    identifiers:
      name: kura-dev-localhost
    attrs:
      name: kura-dev-localhost
      certificate_data: !File /certs/localhost.pem
      key_data: !File /certs/localhost.key

  # The device code flow kura-cli and the plugin log in with (§6.2): the user
  # is sent through the default authentication flow first, then enters the code.
  - model: authentik_flows.flow
    id: flow-device-code
    identifiers:
      slug: kura-device-code
    attrs:
      name: kura device code
      title: Connect a kura device
      slug: kura-device-code
      designation: stage_configuration
      authentication: require_authenticated

  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      default: true
      web_certificate: !KeyOf cert-localhost
      flow_device_code: !KeyOf flow-device-code

  - model: authentik_core.group
    id: group-owners
    identifiers: { name: kura-dev-owners }
    attrs: { name: kura-dev-owners }

  - model: authentik_core.group
    id: group-members
    identifiers: { name: kura-dev }
    attrs: { name: kura-dev }

  - model: authentik_core.group
    id: group-platform-admins
    identifiers: { name: kura-platform-admins }
    attrs: { name: kura-platform-admins }

  - model: authentik_core.user
    identifiers: { username: alice }
    attrs:
      username: alice
      name: Alice
      email: alice@kura.local
      password: kura-dev
      is_active: true
      groups: [!KeyOf group-owners, !KeyOf group-platform-admins]

  - model: authentik_core.user
    identifiers: { username: bob }
    attrs:
      username: bob
      name: Bob
      email: bob@kura.local
      password: kura-dev
      is_active: true
      groups: [!KeyOf group-members]

  - model: authentik_core.user
    identifiers: { username: carol }
    attrs:
      username: carol
      name: Carol
      email: carol@kura.local
      password: kura-dev
      is_active: true

  # One public client per client type, matching oidc.audiences in dev/server.yaml.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-kura-cli
    identifiers: { name: kura-cli }
    attrs:
      name: kura-cli
      client_type: public
      client_id: kura-cli
      # One issuer for both client types: the server accepts one (§4.1).
      issuer_mode: global
      grant_types: [authorization_code, refresh_token, "urn:ietf:params:oauth:grant-type:device_code"]
      include_claims_in_id_token: true
      # The device code lives as long as this (60 s by default: too short to type it).
      access_code_validity: minutes=10
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      redirect_uris:
        - matching_mode: regex
          url: "http://127.0.0.1:[0-9]+/callback"

  - model: authentik_core.application
    identifiers: { slug: kura }
    attrs:
      name: kura
      slug: kura
      provider: !KeyOf provider-kura-cli

  # The Obsidian plugin's client (§6.2): same flows, its own audience.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-kura-plugin
    identifiers: { name: kura-plugin }
    attrs:
      name: kura-plugin
      client_type: public
      client_id: kura-plugin
      issuer_mode: global
      grant_types: [authorization_code, refresh_token, "urn:ietf:params:oauth:grant-type:device_code"]
      include_claims_in_id_token: true
      access_code_validity: minutes=10
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      redirect_uris:
        - matching_mode: strict
          url: "app://obsidian.md"

  - model: authentik_core.application
    identifiers: { slug: kura-plugin }
    attrs:
      name: Kura Sync
      slug: kura-plugin
      provider: !KeyOf provider-kura-plugin
