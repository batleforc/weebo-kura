{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kura.name" . }}-backup
  labels: {{- include "kura.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {{- include "kura.jobLabels" (dict "root" . "component" "backup") | nindent 12 }}
        spec:
          restartPolicy: Never
          # The same identity as the server: it reads the database and the
          # bucket from Vault.
          serviceAccountName: {{ .Values.serviceAccount.name }}
          securityContext: { fsGroup: 65532 }
          {{- with .Values.hostAliases }}
          hostAliases: {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: {{ include "kura.image" . }}
              args: [backup, --config, /etc/kura/server/server.yaml]
              envFrom:
                - secretRef: { name: {{ .Values.backup.targetSecret }} }
              {{- with .Values.extraEnv }}
              env: {{- toYaml . | nindent 16 }}
              {{- end }}
              resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
              securityContext: {{- include "kura.securityContext" . | nindent 16 }}
              volumeMounts:
                - { name: server, mountPath: /etc/kura/server, readOnly: true }
                {{- with .Values.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            - name: server
              configMap: { name: {{ include "kura.name" . }}-server }
            {{- with .Values.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
