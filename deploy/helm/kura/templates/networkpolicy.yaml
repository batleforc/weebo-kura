{{- if .Values.networkPolicy.enabled }}
# Ingress only: the API from the ingress controller, the metrics port from
# Prometheus. Egress stays open (PostgreSQL, the bucket, Vault, Authentik).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kura.name" . }}
  labels: {{- include "kura.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kura.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} }
      ports: [{ port: 8080 }]
    {{- if eq (include "kura.documentsSource" .) "operator" }}
    # kura-operator pushes the documents (RFC 0009 §6.4).
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.operatorNamespace }} }
      ports: [{ port: 8080 }]
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} }
      ports: [{ port: 9090 }]
{{- end }}
