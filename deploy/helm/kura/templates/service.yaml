apiVersion: v1
kind: Service
metadata:
  name: {{ include "kura.name" . }}
  labels: {{- include "kura.labels" . | nindent 4 }}
spec:
  selector: {{- include "kura.selector" . | nindent 4 }}
  ports:
    - { name: api, port: 8080, targetPort: api }
---
# Metrics on a Service of their own, which the ingress never routes (§4.4).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kura.name" . }}-metrics
  labels:
    {{- include "kura.labels" . | nindent 4 }}
    kura.weebo.io/metrics: "true"
spec:
  selector: {{- include "kura.selector" . | nindent 4 }}
  ports:
    - { name: metrics, port: 9090, targetPort: metrics }
