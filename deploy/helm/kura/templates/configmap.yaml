apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kura.name" . }}-server
  labels: {{- include "kura.labels" . | nindent 4 }}
data:
  server.yaml: |
    {{- $server := deepCopy .Values.server }}
    {{- $_ := set $server "listen" (dict "api" "0.0.0.0:8080" "metrics" "0.0.0.0:9090") }}
    {{- toYaml $server | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kura.name" . }}-documents
  labels: {{- include "kura.labels" . | nindent 4 }}
data:
  {{- range $file, $body := .Values.documents }}
  {{ $file }}: {{ $body | quote }}
  {{- end }}
