apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kura.name" . }}-server
  labels: {{- include "kura.labels" . | nindent 4 }}
data:
  server.yaml: |
    {{- $server := deepCopy .Values.server }}
    {{- $_ := set $server "listen" (dict "api" "0.0.0.0:8080" "metrics" "0.0.0.0:9090") }}
    {{- if .Values.webhookCa.secretName }}
    {{- $notifications := default dict $server.notifications }}
    {{- $webhook := default dict $notifications.webhook }}
    {{- $_ := set $webhook "caFile" (printf "/etc/kura/webhook-ca/%s" .Values.webhookCa.key) }}
    {{- $_ := set $notifications "webhook" $webhook }}
    {{- $_ := set $server "notifications" $notifications }}
    {{- end }}
    {{- if eq (include "kura.documentsSource" .) "operator" }}
    {{- $operator := default dict $server.documents.operator }}
    {{- /* The cluster issuer serves its keys to authenticated ServiceAccounts, under the cluster CA. */}}
    {{- $_ := set $operator "caFile" (default "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt" $operator.caFile) }}
    {{- $_ := set $operator "tokenFile" (default "/var/run/secrets/kubernetes.io/serviceaccount/token" $operator.tokenFile) }}
    {{- $_ := set $server.documents "operator" $operator }}
    {{- end }}
    {{- toYaml $server | nindent 4 }}
{{- if eq (include "kura.documentsSource" .) "files" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kura.name" . }}-documents
  labels: {{- include "kura.labels" . | nindent 4 }}
data:
  {{- range $file, $body := .Values.documents }}
  {{ $file }}: {{ $body | quote }}
  {{- end }}
{{- end }}
