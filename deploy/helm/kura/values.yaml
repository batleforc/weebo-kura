# weebo-kura (RFC 0001). The defaults run two replicas against a
# CloudNativePG cluster this chart can create, read the database and bucket
# credentials from Vault, and expose the API through a Traefik ingress.

image:
  repository: ghcr.io/batleforc/kura-server
  # Defaults to the chart's appVersion; pin a digest in production.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

replicas: 2

# server.yaml (RFC 0001 §4.1), rendered as is. `vault` is required in a
# cluster: the database URL and the bucket come from Vault KV (decision 48).
server:
  oidc:
    issuer: https://auth.example.org/
    discovery: https://auth.example.org/application/o/kura-cli/
    audiences: [kura-cli, kura-plugin]
    platformAdmin: { claim: groups, value: kura-platform-admins }
  # The ingress controller's pod CIDR, so client addresses survive the proxy.
  trustedProxies: []
  vault:
    address: https://vault.vault:8200
    kubernetesAuth: { mount: kubernetes, role: kura }
    secrets: { database: mv/data/kura/database, bucket: mv/data/kura/bucket }
    transit: { mount: transit }
  maintenance:
    window: "01:00-05:00"
  # The web console (RFC 0003), served by kura-server under /app from the
  # image's /usr/share/kura/ui. Off by default. Its client id must also be
  # in `oidc.audiences`; with Authentik, `discovery` is the console's own
  # application (its CORS follows the application).
  ui:
    enabled: false
    oidc:
      clientId: kura-web
      # discovery: https://auth.example.org/application/o/kura-web/
  # Webhooks (RFC 0003). Off by default. `allowedCidrs` opens private
  # ranges (a hub inside the cluster), never 0.0.0.0/0; `caFile` is set by
  # the chart from `webhookCa` below.
  notifications:
    enabled: false
    webhook:
      allowedCidrs: []
  # Where the KuraTenant and KuraVault documents come from (RFC 0009):
  # `files`, the `documents` below, or `operator`: kura-operator pushes them
  # from the custom resources, and the files are not read. The issuer,
  # audience and subject name kura-operator's ServiceAccount token; the
  # chart adds the ServiceAccount's CA and token, with which kura-server
  # reads the cluster issuer's keys.
  documents:
    source: files
    # operator:
    #   issuer: https://kubernetes.default.svc.cluster.local
    #   audience: kura
    #   subject: system:serviceaccount:kura-operator:kura-operator

# An extra trust root for webhooks only (a hub behind a private CA): a
# Secret holding the PEM bundle. Mounted read-only; sets
# `server.notifications.webhook.caFile`.
webhookCa:
  secretName: ""
  key: ca.pem

# The resource documents (KuraTenant, KuraVault), one key per file, with
# `server.documents.source: files` (the default). They are re-read live: no
# restart on change (§6.10). Not rendered with `source: operator`.
documents: {}
  # tenants.yaml: |
  #   apiVersion: kura.weebo.io/v1alpha1
  #   kind: KuraTenant
  #   ...

# Extra environment variables of the server and backup containers, such as
# KURA_DATABASE_URL from a Secret when `server.vault` is not used, or
# VAULT_CACERT naming a CA mounted through extraVolumes (a Vault behind a
# private CA).
extraEnv: []

# Extra volumes and their mounts, on the server and backup pods: a private
# CA's Secret for Vault, for instance.
extraVolumes: []
  # - name: vault-ca
  #   secret: { secretName: vault-tls, items: [{ key: ca.crt, path: ca.crt }] }
extraVolumeMounts: []
  # - { name: vault-ca, mountPath: /etc/kura/vault-ca, readOnly: true }

# hostAliases of the server and backup pods: an issuer whose public address
# the cluster cannot reach (no hairpin), pointed at the ingress Service.
hostAliases: []
  # - { ip: 10.0.0.10, hostnames: [auth.example.org] }

serviceAccount:
  # The Kubernetes auth role `kura` in Vault binds this account.
  name: kura

ingress:
  enabled: true
  className: traefik
  host: kura.example.org
  tlsSecret: kura-tls
  annotations: {}

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }

# The migration Job runs after the first install (the database exists only
# then) and before every upgrade, as the database owner (§13). Without cnpg.enabled, name the Secret holding the owner's URL.
migrate:
  databaseUrlSecret: { name: "", key: uri }
  # Replaces the Job's Helm hook annotations when set. Under Argo CD, which
  # runs both post-install and pre-upgrade as PreSync (before the database
  # exists), order it with sync waves instead, the CloudNativePG resources
  # first (`cnpg.annotations`), the migration next, everything else after:
  #   argocd.argoproj.io/hook: Sync
  #   argocd.argoproj.io/sync-wave: "-1"
  #   argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  # Not PostSync: a server refuses to start on an older schema, so the
  # resources never turn Healthy and a PostSync hook would never run.
  annotations: {}

podDisruptionBudget:
  minAvailable: 1

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the API (the ingress controller's) and the
  # metrics port (Prometheus').
  ingressNamespace: traefik
  monitoringNamespace: monitoring
  # With `server.documents.source: operator`: kura-operator's namespace,
  # allowed on the API port to push the documents.
  operatorNamespace: kura-operator

monitoring:
  serviceMonitor: { enabled: true, interval: 30s }
  prometheusRule: { enabled: true }

# A CloudNativePG cluster of two instances with barman backups (§10.3,
# decision 48). Its `<name>-app` Secret is the owner's URL for migrations.
cnpg:
  enabled: true
  name: kura-db
  # Annotations of the CloudNativePG resources (its bootstrap ConfigMap,
  # Cluster, ScheduledBackup and NetworkPolicy); under Argo CD, a sync wave
  # before the migration's: argocd.argoproj.io/sync-wave: "-2".
  annotations: {}
  instances: 2
  storage: { size: 10Gi, storageClass: "" }
  # Where the CloudNativePG operator runs: its NetworkPolicy lets it in.
  operatorNamespace: cnpg-system
  backup:
    # s3://bucket/path, on a location other than the kura bucket.
    destinationPath: ""
    endpointURL: ""
    # A Secret with ACCESS_KEY_ID and ACCESS_SECRET_KEY.
    credentialsSecret: kura-db-backup
    retention: 30d
    schedule: "0 0 0 * * *"

# §10.3 requires all three backups (PostgreSQL, the bucket, Vault). The
# chart refuses to render without `cnpg.backup.destinationPath` (when it
# creates the cluster) and `backup.enabled`, unless this is true: a test
# install, or backups done by other means (then alert on them yourself).
backupsWaived: false

# The bucket half of the backup (§6.9, §10.3): `kura-server backup` holds
# the backup lock, records the time T, copies every new object to a second
# bucket, then releases the lock. CloudNativePG archives the WAL
# continuously, so a restore recovers PostgreSQL to T (see the operator
# guide). Run it outside the maintenance window.
backup:
  enabled: false
  schedule: "30 23 * * *"
  # A Secret with KURA_BACKUP_ENDPOINT, KURA_BACKUP_BUCKET,
  # KURA_BACKUP_REGION, KURA_BACKUP_ACCESS_KEY_ID, KURA_BACKUP_SECRET_ACCESS_KEY.
  targetSecret: kura-backup-target
