apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kuravaults.kura.weebo.io
spec:
  group: kura.weebo.io
  names:
    kind: KuraVault
    plural: kuravaults
    singular: kuravault
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantRef.name
      name: Tenant
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'A Kura vault: an Obsidian vault synced through Kura, and who may open it.'
        properties:
          spec:
            description: |-
              A vault: the tenant it belongs to, how its files are cut into chunks,
              what of `.obsidian` syncs, and who may open it. Namespaced: the namespace
              must be one of its tenant's `vaultNamespaces`.
            properties:
              bindings:
                default: []
                description: |-
                  Vault roles granted to claim values or subjects. Absent: only tenant
                  `owner` and `admin` can open the vault.
                items:
                  description: A vault role bound to a claim value or to one OIDC subject, exactly one.
                  properties:
                    claimValue:
                      description: A value of the tenant's mapped claim, such as a group name.
                      nullable: true
                      type: string
                    paths:
                      description: |-
                        `viewer` only: 1 to 16 folders, each ending with `/`, that the holder
                        reads; absent: the whole vault (RFC 0005 §4.1).
                      items:
                        type: string
                      nullable: true
                      type: array
                    role:
                      description: |-
                        The vault role granted: `viewer` reads, `editor` also writes,
                        `manager` also manages bindings and scoped tokens.
                      enum:
                      - viewer
                      - editor
                      - manager
                      type: string
                    subject:
                      description: One OIDC subject (`sub`).
                      nullable: true
                      type: string
                  required:
                  - role
                  type: object
                  x-kubernetes-validations:
                  - message: a binding names exactly one of claimValue and subject
                    rule: has(self.claimValue) != has(self.subject)
                  - message: paths restrict a viewer only
                    rule: '!has(self.paths) || self.role == ''viewer'''
                type: array
              chunking:
                description: |-
                  Content-defined chunking sizes. Absent: the value stored when the
                  vault was created (256Ki, 1Mi, 4Mi by default); fixed once set.
                nullable: true
                properties:
                  avg:
                    anyOf:
                    - minimum: 0.0
                    - pattern: ^[0-9]+(Ki|Mi|Gi|Ti|Ei)?$
                    description: Average chunk the cut points aim at.
                    x-kubernetes-int-or-string: true
                  max:
                    anyOf:
                    - minimum: 0.0
                    - pattern: ^[0-9]+(Ki|Mi|Gi|Ti|Ei)?$
                    description: Largest chunk, at most 4Mi (a mobile client's body).
                    x-kubernetes-int-or-string: true
                  min:
                    anyOf:
                    - minimum: 0.0
                    - pattern: ^[0-9]+(Ki|Mi|Gi|Ti|Ei)?$
                    description: Smallest chunk, except a file's last.
                    x-kubernetes-int-or-string: true
                required:
                - avg
                - max
                - min
                type: object
              configSync:
                description: |-
                  Which parts of the `.obsidian` folder sync, per user and per device
                  profile, never between members. Absent: the folder does not sync.
                nullable: true
                properties:
                  categories:
                    default: []
                    description: |-
                      The parts of `.obsidian` that sync: `plugins`, `snippets`, `themes`,
                      `hotkeys`.
                    items:
                      description: A part of the `.obsidian` folder.
                      enum:
                      - plugins
                      - snippets
                      - themes
                      - hotkeys
                      type: string
                    type: array
                type: object
              deletionPolicy:
                default: Orphan
                description: |-
                  What removing this document does: `Orphan` (default) disables the
                  vault and keeps its data; `Delete` also deletes it after 30 days,
                  cancelled if the document comes back.
                enum:
                - Orphan
                - Delete
                type: string
              tenantRef:
                description: The `KuraTenant` this vault belongs to.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            required:
            - tenantRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: '`Ready`, with one of Kura''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: The `metadata.generation` the last reconcile applied.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: KuraVaultResource
        type: object
    served: true
    storage: true
    subresources:
      status: {}
