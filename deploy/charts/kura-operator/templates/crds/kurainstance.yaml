{{- if .Values.crds.install }}
# Generated by `task helm:crds` from the CRD of the same name: do not edit.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kurainstances.kura.weebo.io
  {{- include "weebo-operator.crdMetadata" . | nindent 2 }}
spec:
  group: kura.weebo.io
  names:
    kind: KuraInstance
    plural: kurainstances
    singular: kurainstance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Kura server the operator hands the KuraTenant and KuraVault documents to.
        properties:
          spec:
            description: |-
              The Kura server the operator pushes `KuraTenant` and `KuraVault` to.
              Cluster-scoped: one server serves the cluster. `Ready` tells whether the
              server answers and accepts the operator's identity.
            properties:
              auth:
                description: |-
                  How the operator proves who it is to the server. Required: the server
                  accepts the documents from one configured identity only.
                properties:
                  serviceAccountToken:
                    description: |-
                      A projected ServiceAccount token, rotated by the kubelet, that the
                      server verifies against the cluster's OIDC issuer. No secret at rest.
                    properties:
                      audience:
                        description: The token's audience, equal to the server's `documents.operator.audience`.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - audience
                    type: object
                required:
                - serviceAccountToken
                type: object
              tls:
                description: How the operator verifies the server's TLS certificate (`https` only).
                nullable: true
                properties:
                  caSecretRef:
                    description: |-
                      Optional custom CA certificate to verify the instance's TLS with,
                      read from a Kubernetes `Secret` (the referenced `key` must hold a PEM
                      bundle). Use this to trust a private CA without mounting it into the
                      operator pod — the operator reads the Secret via the API and hands the
                      PEM to its HTTP client. It is added *on top of* the platform trust
                      store, so publicly-signed endpoints keep working. When unset, only the
                      platform trust store (plus the usual `SSL_CERT_FILE`/`SSL_CERT_DIR`
                      env vars) is used.
                    nullable: true
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  insecureSkipVerify:
                    default: false
                    description: |-
                      Skip certificate verification entirely — insecure, intended only for
                      throwaway/self-signed instances. Prefer `caSecretRef` below, which
                      trusts a private CA without turning verification off.
                    type: boolean
                type: object
              url:
                description: |-
                  Base URL of the Kura server's API, such as `http://kura.kura.svc:8080`.
                  Use `https` for anything that leaves the node.
                pattern: ^https?://[^/?#\s]+(/[^?#\s]*)?$
                type: string
            required:
            - auth
            - url
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                description: '`Ready`, with one of Kura''s reason codes.'
                items:
                  properties:
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: One of the operator's reason codes — never a hand-written string.
                      type: string
                    status:
                      description: '`"True"`, `"False"`, or `"Unknown"`.'
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              instance:
                description: The `KuraInstance` the operator pushed this object to (RFC 0009 §6.3).
                nullable: true
                properties:
                  kind:
                    description: '`Instance` or `LocalInstance`.'
                    enum:
                    - Instance
                    - LocalInstance
                    type: string
                  name:
                    type: string
                  namespace:
                    description: The local instance's namespace; absent for a cluster-scoped one.
                    nullable: true
                    type: string
                required:
                - kind
                - name
                type: object
              observedGeneration:
                description: The `metadata.generation` the last reconcile applied.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: KuraInstance
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
