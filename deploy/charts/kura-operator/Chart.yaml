apiVersion: v2
name: kura-operator
description: kura-operator, which hands KuraTenant and KuraVault custom resources to kura-server (RFC 0009).
type: application
version: 0.4.0
appVersion: "0.4.0"
# Native `preStop: sleep` and the admission/policy APIs used here.
kubeVersion: ">=1.30.0-0"
home: https://github.com/batleforc/weebo-kura
sources:
  - https://github.com/batleforc/weebo-kura
keywords:
  - kura
  - operator
  - kubernetes-operator
  - crd
maintainers:
  - name: batleforc
    url: https://github.com/batleforc
dependencies:
  # Every resource but the CRDs (templates/operator.yaml); its version is
  # the kit's, as in Cargo.toml (`task kit:sync` keeps them in step).
  - name: weebo-operator-lib
    version: 0.32.0
    repository: oci://ghcr.io/weebo-si-operator/charts
