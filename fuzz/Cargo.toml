# Its own workspace: the fuzz build carries the parsers and nothing that needs a network.
[workspace]

[package]
name = "kura-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kura-api = { path = "../crates/kura-api" }
kura-core = { path = "../crates/kura-core", features = ["merge", "webhook"] }
arbitrary = "1"
serde_norway = "0.9"
serde_json = "1"

# One [[bin]] per target; `cargo fuzz list` and the CI loop read them from here.
[[bin]]
name = "fuzz_config_document"
path = "fuzz_targets/fuzz_config_document.rs"
test = false
doc = false

[[bin]]
name = "fuzz_chunking"
path = "fuzz_targets/fuzz_chunking.rs"
test = false
doc = false

[[bin]]
name = "fuzz_vault_path"
path = "fuzz_targets/fuzz_vault_path.rs"
test = false
doc = false

[[bin]]
name = "fuzz_commit_body"
path = "fuzz_targets/fuzz_commit_body.rs"
test = false
doc = false

[[bin]]
name = "fuzz_merge"
path = "fuzz_targets/fuzz_merge.rs"
test = false
doc = false

[[bin]]
name = "fuzz_scoped_token"
path = "fuzz_targets/fuzz_scoped_token.rs"
test = false
doc = false

[[bin]]
name = "fuzz_chunk_records"
path = "fuzz_targets/fuzz_chunk_records.rs"
test = false
doc = false

[[bin]]
name = "fuzz_webhook_target"
path = "fuzz_targets/fuzz_webhook_target.rs"
test = false
doc = false
