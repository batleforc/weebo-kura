# Daily bumps keep every dependency on its latest release; `cooldown` waits seven
# days before proposing a version, security updates don't wait. mise tools and the
# Containerfile bases move through update.yml (`task update`, updatecli).
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directories: ["/ui", "/plugin"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
