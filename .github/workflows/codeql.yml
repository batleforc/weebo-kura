name: codeql

# Report only (weebo-security). Needs code scanning on the repository: set the
# repository variable CODE_SCANNING=true once it is (public repo, or GitHub Code
# Security); until then the job is skipped instead of failing on upload.
# Unfiltered by `paths:`: a filtered workflow does not run, it does not pass.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "50 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: vars.CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Both extractors are buildless: no toolchain, no cargo build.
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
