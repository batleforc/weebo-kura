name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A run by hand, e.g. after the workflow was re-enabled.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # Only the PR commits: `cog check` fails without a tag, and GitHub's template "Initial commit" is not conventional.
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # cog reads user.name and panics without it; the runner has none.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for c in $(git rev-list --no-merges "$BASE..HEAD"); do
            cog verify "$(git log -1 --format=%B "$c")"
          done
      - run: task lint
      - run: task openapi:check
      # gitleaks, task audit and the image scan: security.yml (also daily).

  # kura-operator's envtest tests (RFC 0009): a real kube-apiserver and etcd,
  # downloaded by envtest; its bindgen step needs libclang (the kit's checks.yml).
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          # libclang-dev is a transitional package on current runners.
          LIBCLANG_SO="$(find /usr/lib -iname 'libclang.so*' 2>/dev/null | head -n1)"
          test -n "$LIBCLANG_SO" || { echo "::error::libclang.so not found" >&2; exit 1; }
          {
            echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_SO")"
            echo "BINDGEN_EXTRA_CLANG_ARGS="
          } >> "$GITHUB_ENV"
      - run: task operator:test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # The Obsidian plugin: WASM core, strict TypeScript, tests with the 80% gate, bundle within 3 MB.
      - run: task plugin:install
      - run: task plugin:test
      - run: task plugin:build

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # The web console: tests with the 80% gate, and the build with its budget checks.
      - run: task ui:install
      - run: task ui:test
      - run: task ui:build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # The site: generated CRD pages current, MDX that compiles, links that resolve.
      - run: task docs:gen
      - run: git diff --exit-code -- docs/content/docs/crds docs/public/crd-schemas
      - run: task docs:build

  test:
    runs-on: ubuntu-latest
    services:
      # Integration tests skip loudly without it; CI never skips (weebo-testing).
      postgres:
        image: docker.io/library/postgres:18-alpine
        env:
          POSTGRES_PASSWORD: kura-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      vault:
        # OpenBao (Vault's MPL-2.0 fork), the same image as task dev:vault.
        image: quay.io/openbao/openbao:2.7.2
        env:
          BAO_DEV_ROOT_TOKEN_ID: kura-ci
        ports: ["8200:8200"]
      s3:
        # The same pin as task dev:s3; bump both together.
        image: docker.io/rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
        env:
          RUSTFS_ACCESS_KEY: kura-dev
          RUSTFS_SECRET_KEY: kura-dev-secret
        ports: ["9000:9000"]
    env:
      KURA_TEST_DATABASE_URL: postgres://postgres:kura-ci@localhost:5432/postgres
      KURA_TEST_VAULT_ADDR: http://localhost:8200
      KURA_TEST_VAULT_TOKEN: kura-ci
      KURA_TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Test bucket
        run: docker exec ${{ job.services.s3.id }} mkdir -p /data/kura-test
      - run: task test
      - run: task coverage-check
