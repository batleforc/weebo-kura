name: update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No push token in .git/config while freshly bumped tools run (review 2026-11-15 #12).
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: task update
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update
          commit-message: "chore(deps): update tooling"
          title: "chore(deps): update tooling"
          body: "Automated `task update`: `mise upgrade --bump` + `mise lock`."
          sign-commits: true
          signoff: true
          delete-branch: true
