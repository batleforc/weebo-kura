name: Docs

# Builds the documentation site as a static export and publishes it to GitHub
# Pages (https://batleforc.github.io/weebo-kura), as the weebo operators do.
#
# One-time setup: Settings → Pages → Build and deployment → Source =
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - docs/**
      # The resource reference pages come from these.
      - deploy/crd/**
      - .tasks/docs.yaml
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time, never cancelled midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the site's base path and origin.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the static site
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DOCS_SITE_URL: ${{ steps.pages.outputs.origin }}
        run: task docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
