# Empty stand-in for sqlx-sqlite (plan E1, retired by this patch). sqlx 0.9
# lists it as an optional dependency, so Cargo.lock carried libsqlite3-sys
# (RUSTSEC-2026-0459) although nothing compiled it. Kura only uses PostgreSQL;
# this stub keeps the lockfile, and every scanner reading it, free of SQLite.
# Same version and feature names as the real crate so sqlx's manifest resolves;
# turning on sqlx's `sqlite` feature fails to compile, which is the intent.
[package]
name = "sqlx-sqlite"
version = "0.9.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[features]
_unstable-all-sqlite-features = []
_unstable-all-types = []
_unstable-docs = []
any = []
bigdecimal = []
bundled = []
chrono = []
deserialize = []
json = []
load-extension = []
migrate = []
offline = []
preupdate-hook = []
regexp = []
rust_decimal = []
sqlx-toml = []
time = []
unbundled = []
unlock-notify = []
uuid = []
