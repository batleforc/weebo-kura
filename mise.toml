[tools]
cocogitto = "latest"
node = "lts"
# Exact pin (plan PR 1.1): the toolchain is only pinned here, no rust-toolchain.toml.
rust = { version = "1.100.0", components = "rust-src,rustfmt,llvm-tools,clippy", profile = "default", targets = "wasm32-unknown-unknown" }
task = "latest"
gitleaks = "latest"
jq = "latest"
shellcheck = "latest"
trivy = "latest"
claude = "latest"
rtk = "latest"
uv = "latest"
"pipx:desloppify[full]" = "latest"
"pipx:graphifyy" = "latest"
"github:batleforc/weebo-skillsagent" = "0.17.0"
cargo-binstall = "latest"
# task audit
cargo-deny = "latest"
"aqua:rustsec/rustsec/cargo-audit" = "latest"
# task coverage-check
"aqua:taiki-e/cargo-llvm-cov" = "latest"
# migrations (PR 1.4); only the postgres driver is needed
"cargo:sqlx-cli" = { version = "latest", features = "postgres,rustls", default-features = "false" }
# task fuzz / fuzz:check
"cargo:cargo-fuzz" = "latest"
# OpenAPI lint (weebo-api-contract)
spectral = "latest"
# The Obsidian plugin (phase 4): its package manager, the WASM bindings CLI
# (must equal the `wasm-bindgen` crate's version) and `wasm-opt` (decision 54).
pnpm = "latest"
"cargo:wasm-bindgen-cli" = "0.2.130"
"aqua:WebAssembly/binaryen" = "latest"

[env]
# Nightly only for `cargo fuzz`, pinned by date so a fuzz run is reproducible.
KURA_FUZZ_TOOLCHAIN = "nightly-2026-11-01"
