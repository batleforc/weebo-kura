# Flattened into the root Taskfile: each name here is the name users type.
version: "3"

tasks:
  build:
    desc: Build the entire workspace
    cmds:
      - cargo build --workspace --exclude kura-operator-testkit

  check:
    desc: Type-check the entire workspace without building
    cmds:
      - cargo check --workspace --all-targets --exclude kura-operator-testkit

  rust:lint:
    desc: Run clippy (warnings are errors) and the format check across the workspace
    cmds:
      - cargo clippy --workspace --all-targets --exclude kura-operator-testkit -- -D warnings
      # kura-core also runs in WASM inside Obsidian (§6.8): it must build there.
      - cargo clippy -p kura-core --target wasm32-unknown-unknown -- -D warnings
      - cargo fmt --all --check

  fmt:
    desc: Format all Rust source files
    cmds:
      - cargo fmt --all

  clean:stale:
    desc: "Drop build artefacts not touched since yesterday (cargo sweep), then show the size of target/"
    # Cargo never removes an artefact whose hash changed; a dependency bump leaves the old one behind.
    cmds:
      - cargo sweep --time 1
      - "du -sh target || true"
