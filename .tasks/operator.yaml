# kura-operator (RFC 0009). Its envtest tests live in kura-operator-testkit,
# left out of the `--workspace` tasks: building envtest needs Go (mise) and a
# real libclang.so with the C headers. Defaults match Fedora's clang-libs and
# gcc; an exported value wins, even an empty one (Ubuntu's libclang-dev finds
# its own headers: BINDGEN_EXTRA_CLANG_ARGS="").
version: "3"

env:
  LIBCLANG_PATH:
    sh: echo "${LIBCLANG_PATH-/usr/lib64}"
  BINDGEN_EXTRA_CLANG_ARGS:
    sh: echo "${BINDGEN_EXTRA_CLANG_ARGS--I/usr/lib/gcc/x86_64-redhat-linux/16/include -I/usr/include}"

tasks:
  operator:test:
    desc: "Run kura-operator's envtest tests, its binary included, against a real kube-apiserver and etcd, and fail under 86% line coverage of the operator's crates (KUBEBUILDER_ASSETS names their directory; unset, envtest downloads its latest release)"
    # envtest's build script runs `go` from its own crate folder, where mise's
    # shim finds no version: the real binary first (Task leaves an existing
    # PATH alone, hence in the command).
    vars:
      GO_BIN:
        sh: dirname "$(mise which go)"
      # The operator's own code only: kura-api has its own gate, the testkit
      # and the in-memory Kura are test code.
      EXCLUDE: 'crates/kura-|crates/operator/testkit/|crates/operator/application/src/test_support\.rs'
    cmds:
      - PATH="{{.GO_BIN}}:$PATH" cargo clippy -p kura-operator-testkit --all-targets -- -D warnings
      # show-env instruments plain cargo builds: the binary that tests/binary.rs
      # spawns is measured too, its profile written on its SIGTERM exit.
      - |
        export PATH="{{.GO_BIN}}:$PATH"
        eval "$(cargo llvm-cov show-env --sh)"
        cargo llvm-cov clean --workspace
        KURA_OPERATOR_BIN="$(cargo build -p kura-operator --message-format=json-render-diagnostics \
          | jq -r 'select(.executable != null and .target.name == "kura-operator") | .executable')"
        export KURA_OPERATOR_BIN
        cargo test -p kura-operator-testkit -p kura-operator-domain -p kura-operator-application \
          -p kura-operator-adapters-inbound -p kura-operator-adapters-outbound
        cargo llvm-cov report --ignore-filename-regex '{{.EXCLUDE}}' --fail-under-lines 86

  operator:perf:
    desc: "Measure kura-operator's release binary against envtest and the kit's small-cluster budget (report in target/perf/kura-operator.md)"
    vars:
      GO_BIN:
        sh: dirname "$(mise which go)"
    cmds:
      - cargo build --release -p kura-operator
      - PATH="{{.GO_BIN}}:$PATH" cargo test --release -p kura-operator-testkit --test perf -- --ignored --nocapture

  operator:proof:
    desc: "RFC 0009 §6.P on kind: build both images with podman, then tests/heavy/operator.sh (KEEP=1 leaves the cluster up)"
    cmds:
      - podman build -f Containerfile -t localhost/kura-server:proof .
      - podman build -f Containerfile.operator -t localhost/kura-operator:proof .
      - tests/heavy/operator.sh

  operator:run:
    desc: "Run kura-operator against the current kubeconfig's cluster (POD_NAMESPACE and KURA_SERVICE_ACCOUNT name the ServiceAccount it mints tokens for; the webhook needs WEBHOOK_TLS_CERT_FILE and WEBHOOK_TLS_KEY_FILE)"
    cmds:
      - cargo run -p kura-operator
