version: "3"

vars:
  CHART: deploy/helm/kura
  # CRD schemas (ServiceMonitor, PrometheusRule, CloudNativePG) for kubeconform.
  CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{"{{"}}.Group{{"}}"}}/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json

tasks:
  helm:lint:
    desc: "Lint the Helm chart, validate its renders (defaults, then every option on) with kubeconform, and check its copy of bootstrap-roles.sql"
    cmds:
      - helm lint --strict {{.CHART}}
      - |
        set -e
        # The defaults refuse to render without backups (§10.3).
        if helm template kura {{.CHART}} >/dev/null 2>&1; then echo "the chart rendered without backups"; exit 1; fi
        for opts in "--set cnpg.backup.destinationPath=s3://b/p --set backup.enabled=true" "--set backupsWaived=true" "--set backupsWaived=true --set server.ui.enabled=true --set server.oidc.audiences={kura-cli,kura-plugin,kura-web} --set server.notifications.enabled=true --set server.notifications.webhook.allowedCidrs={10.42.7.15/32} --set webhookCa.secretName=hub-ca" "--set backupsWaived=true --set cnpg.enabled=false --set migrate.databaseUrlSecret.name=db --set ingress.enabled=false --set networkPolicy.enabled=false --set monitoring.serviceMonitor.enabled=false --set monitoring.prometheusRule.enabled=false"; do
          # shellcheck disable=SC2086
          helm template kura {{.CHART}} $opts | kubeconform -strict -summary -kubernetes-version 1.34.0 -schema-location default -schema-location '{{.CRDS}}'
        done
      # RFC 0009 T3: with the operator as the source, the operator's namespace
      # reaches the API port, and no documents ConfigMap or mount is rendered.
      - |
        set -e
        out="$(helm template kura {{.CHART}} --set backupsWaived=true --set server.documents.source=operator \
          --set server.documents.operator.issuer=https://kubernetes.default.svc.cluster.local \
          --set server.documents.operator.audience=kura \
          --set server.documents.operator.subject=system:serviceaccount:kura-operator:kura-operator)"
        printf '%s\n' "$out" | kubeconform -strict -summary -kubernetes-version 1.34.0 -schema-location default -schema-location '{{.CRDS}}'
        printf '%s\n' "$out" | grep -q 'kubernetes.io/metadata.name: kura-operator'
        printf '%s\n' "$out" | grep -q 'tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token'
        if printf '%s\n' "$out" | grep -qE 'kura-documents|KURA_CONFIG_DIR'; then echo "documents rendered in operator mode"; exit 1; fi
        if helm template kura {{.CHART}} --set backupsWaived=true | grep -q 'metadata.name: kura-operator'; then echo "operator admitted in files mode"; exit 1; fi
      # The chart cannot read files outside itself: it keeps a copy, never a different one.
      - diff -u crates/kura-server/sql/bootstrap-roles.sql {{.CHART}}/files/bootstrap-roles.sql

  alerts:test:
    desc: "Check the chart's alert rules and run their promtool unit tests; every alert needs a test"
    cmds:
      - promtool check rules {{.CHART}}/files/alerts.yaml {{.CHART}}/files/backup-alerts.yaml
      - cd deploy/alerts && promtool test rules tests.yaml
      - |
        missing=$(comm -23 <(grep -hoP '^\s+- alert: \K\w+' {{.CHART}}/files/alerts.yaml {{.CHART}}/files/backup-alerts.yaml | sort -u) <(grep -oP 'alertname: \K\w+' deploy/alerts/tests.yaml | sort -u))
        [ -z "$missing" ] || { echo "alerts without a test: $missing"; exit 1; }
