[package]
name = "kura-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "kura-operator"
path = "src/main.rs"

[dependencies]
kura-api = { workspace = true, features = ["crd"] }
kura-operator-adapters-inbound = { workspace = true }
kura-operator-adapters-outbound = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
kube = { workspace = true, features = ["client", "runtime"] }
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
weebo-kit-runtime = { workspace = true }

[lints]
workspace = true
