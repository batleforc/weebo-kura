[package]
name = "kura-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kura"
path = "src/main.rs"

[dependencies]
kura-core = { workspace = true, features = ["scope"] }
clap = { workspace = true }
reqwest = { workspace = true, features = ["form", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
base64 = { workspace = true }
# `kura watch` (§6.3); the version axum links, TLS through rustls and the OS roots.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"

[lints]
workspace = true

[dev-dependencies]
http = "1"
