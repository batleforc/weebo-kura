[package]
name = "kura-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
fastcdc = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
unicode-normalization = { workspace = true }
utoipa = { workspace = true, optional = true }
diffy = { workspace = true, optional = true }
url = { version = "2", optional = true }
caseless = { workspace = true, optional = true }

[features]
# The server derives its OpenAPI schemas from the wire types.
openapi = ["dep:utoipa", "utoipa/uuid"]
# The three-way merge runs on the server; the WASM core leaves it out (decision 54).
merge = ["dep:diffy"]
# The webhook target rules of RFC 0003, on the server and in the fuzz build.
webhook = ["dep:url"]
# Folder scopes of tokens and viewers (RFC 0004, 0005): the server, the CLI,
# the fuzz build; the WASM core leaves it out.
scope = ["dep:caseless"]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
